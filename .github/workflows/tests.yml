name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and verification dependencies
        run: python -m pip install '.[qiskit,test,benchmark]' build
      - name: Test certification and standalone benchmarks
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
